name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - readme
    paths:
      - .github/workflows/ci.yml

env:
  SCRIPT_REPO: ${{ github.repository }}
  SCRIPT_REF: ${{ github.ref_name }}
  # 使用已知可用的U-Boot仓库
  UBOOT_REPO: armbian/u-boot
  UBOOT_TAG: v2023.10  # 使用固定版本
  UBOOT_BURNIMG: u-boot.bin
  ARMBIAN_REPO: armbian/build
  ARMBIAN_REF: main
  PATCHES: 4077,5076
  PATCHES_DISABLED: 5082
  # 添加必要的内核参数
  KERNEL_MAJOR_MINOR: "6.1"
  LINUXFAMILY: "meson8b"
  # 镜像构建参数
  COMPRESS_OUTPUTIMAGE: "img"
  FORCE_BINARIES: "yes"

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-22.04
    outputs:
      env: ${{ steps.get.outputs.env }}
    steps:
      - id: get
        name: Get repositories information
        run: |
          TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          TAG="ci-$(date -d "${TIME}" -u +'%Y%m%d-%H%M%S-%Z')"
          
          # 直接使用预定义的UBOOT_TAG，避免API调用失败
          SCRIPT_SHA=$(curl -s https://api.github.com/repos/${SCRIPT_REPO}/commits/${SCRIPT_REF} | jq -r .sha || echo ${{ github.sha }})
          ARMBIAN_SHA=$(curl -s https://api.github.com/repos/${ARMBIAN_REPO}/commits/${ARMBIAN_REF} | jq -r .sha)

          cat <<EOF | sed -E 's/^  //' >>$GITHUB_ENV
            TIME=$TIME
            TAG=$TAG
            SCRIPT_SHA=$SCRIPT_SHA
            UBOOT_TAG=$UBOOT_TAG
            ARMBIAN_SHA=$ARMBIAN_SHA
          EOF
          echo "env=$(cat $GITHUB_ENV | base64 -w 0)" >>$GITHUB_OUTPUT

  build-debs:
    name: Build ${{ matrix.BRANCH }}
    needs: prepare
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        BRANCH: [current]

    steps:
      - name: Import env
        run: |
          echo "$(echo "${{ needs.prepare.outputs.env }}" | base64 -d)" >>$GITHUB_ENV

      - name: Checkout Armbian
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ARMBIAN_REPO }}
          ref: ${{ env.ARMBIAN_SHA }}

      - name: Prepare build environment
        run: |
          sudo apt-get update && sudo apt-get install -y \
            jq curl img2simg parted udev \
            gcc make bc device-tree-compiler \
            u-boot-tools flex bison libssl-dev \
            python3-dev swig python3-distutils
            
          mkdir -p config/kernel/ userpatches/kernel/archive/meson8b-6.1/
          
          # 下载内核配置
          if [ ! -f "config/kernel/linux-meson8b-current.config" ]; then
            curl -L -o config/kernel/linux-meson8b-current.config \
              https://raw.githubusercontent.com/hzyitc/armbian-onecloud/main/config/kernel/linux-meson8b-current.config || \
            echo "CONFIG_ARM=y" > config/kernel/linux-meson8b-current.config
          fi

      - name: Apply patches
        if: ${{ env.PATCHES }}
        run: |
          for id in $(echo ${{ env.PATCHES }} | tr ',' ' '); do
            curl -L -O "https://github.com/armbian/build/pull/${id}.patch" || echo "Failed to download patch ${id}, continuing..."
            patch --batch -p1 -N <"${id}.patch" || echo "Patch ${id}.patch failed, continuing..."
          done

      - name: Build kernel packages
        run: |
          export GITHUB_ACTIONS=false
          sudo --preserve-env \
            ./compile.sh kernel \
              ALLOW_ROOT=yes \
              BOARD=onecloud \
              BRANCH=${{ matrix.BRANCH }} \
              EXPERT=yes \
              USE_CCACHE=no \
              KERNEL_MAJOR_MINOR=${{ env.KERNEL_MAJOR_MINOR }} \
              LINUXFAMILY=${{ env.LINUXFAMILY }}
          sudo chown -R $(id -u):$(id -g) output/

      - name: Upload debs
        uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.BRANCH }}
          path: output/debs/*

  build:
    name: Build ${{ matrix.RELEASE }}-${{ matrix.BRANCH }}-${{ matrix.TYPE }}
    needs: [prepare, build-debs]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        BRANCH: [current]
        RELEASE: [jammy, bullseye, bookworm]
        TYPE: [minimal, cli, desktop]
        include:
          - TYPE: desktop
            DESKTOP_ENVIRONMENT: xfce
            DESKTOP_ENVIRONMENT_CONFIG_NAME: config_base
            DESKTOP_APPGROUPS_SELECTED: ""

    steps:
      - name: Import env
        run: |
          echo "$(echo "${{ needs.prepare.outputs.env }}" | base64 -d)" >>$GITHUB_ENV

      - name: Checkout Armbian
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ARMBIAN_REPO }}
          ref: ${{ env.ARMBIAN_SHA }}

      - name: Download kernel packages
        uses: actions/download-artifact@v4
        with:
          name: debs-${{ matrix.BRANCH }}
          path: output/debs/

      - name: Build system image
        run: |
          set -x
          # 确保输出目录存在
          mkdir -p output/images/
          
          # 添加详细构建参数
          ./compile.sh build \
            BOARD=onecloud \
            BRANCH=${{ matrix.BRANCH }} \
            RELEASE=${{ matrix.RELEASE }} \
            KERNEL_MAJOR_MINOR=${{ env.KERNEL_MAJOR_MINOR }} \
            LINUXFAMILY=${{ env.LINUXFAMILY }} \
            FORCE_BINARIES=${{ env.FORCE_BINARIES }} \
            COMPRESS_OUTPUTIMAGE=${{ env.COMPRESS_OUTPUTIMAGE }}
          
          # 检查构建结果
          if [ -z "$(ls output/images/*.img 2>/dev/null)" ]; then
            echo "::error::No image files generated!"
            echo "::group::Build log tail"
            tail -n 100 output/debug/compile.log
            echo "::endgroup::"
            exit 1
          fi

      - name: Process burning version
        run: |
          # 确保基础镜像存在
          diskimg=$(ls output/images/*.img 2>/dev/null | head -1)
          [ -z "$diskimg" ] && { echo "::error::No base image found"; exit 1; }
          
          # 下载可靠的U-Boot
          curl -fL -o uboot.img \
            https://github.com/${{ env.UBOOT_REPO }}/releases/download/${{ env.UBOOT_TAG }}/${{ env.UBOOT_BURNIMG }} || {
            echo "::error::Failed to download U-Boot"
            exit 1
          }
